name: Deploy Backend to Hugging Face Spaces

on:
  push:
    branches: [ master ]

jobs:
  deploy-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history so push works

      - name: Rename Dockerfile for Hugging Face
        run: |
          # Hugging Face looks for a file exactly named "Dockerfile" by default
          cp Dockerfile.backend Dockerfile
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add Dockerfile
          # We commit this change locally on the runner before pushing to HF
          git commit -m "chore: setup Dockerfile for Hugging Face deployment" || true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          SPACE_NAME: "atrionnet-api" # The name of the space you create
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ]; then
            echo "Error: HF_TOKEN or HF_USERNAME secrets are missing!"
            exit 1
          fi
          
          git remote add space https://huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME
          # We use the token in the URL for authentication
          git remote set-url space https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME
          
          # Force push to the 'main' branch on Hugging Face
          git push space master:main --force
